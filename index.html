<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: monospace; background: #000; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .player { width: 100%; max-width: 500px; border: 1px solid #333; padding: 20px; background: #0a0a0a; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 1.2rem; text-transform: uppercase; }
        input, button, select { background: #000; color: #fff; border: 1px solid #333; padding: 8px; font-family: monospace; cursor: pointer; }
        button:hover { background: #fff; color: #000; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .track-list { margin-top: 20px; max-height: 300px; overflow-y: auto; border-top: 1px solid #333; }
        .track { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #1a1a1a; align-items: center; }
        .track.active { background: #fff; color: #000; }
        .progress-bar { width: 100%; height: 4px; background: #222; margin: 15px 0; cursor: pointer; }
        .progress { height: 100%; background: #fff; width: 0%; transition: width 0.1s; }
        .input-group { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .time { display: flex; justify-content: space-between; font-size: 0.8rem; opacity: 0.6; }
        audio { display: none; }
    </style>
</head>
<body>
    <div class="player">
        <h1>— MP3 Library</h1>
        <audio id="audio"></audio>
        
        <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="progress-bar" id="p-bar"><div class="progress" id="p-inner"></div></div>

        <div class="controls">
            <button onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
            <button onclick="changeVol(-0.1)"><i class="fas fa-volume-down"></i></button>
            <button onclick="changeVol(0.1)"><i class="fas fa-volume-up"></i></button>
        </div>

        <div class="track-list" id="list"></div>

        <div class="input-group">
            <input type="text" id="url" placeholder="MP3 URL">
            <button onclick="addTrack()">ADD TRACK</button>
            <button onclick="loadFromJSON()" style="border-style: dashed;">FETCH REMOTE JSON</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio'), pInner = document.getElementById('p-inner'), 
              playIcon = document.getElementById('playIcon'), list = document.getElementById('list');
        let tracks = JSON.parse(localStorage.getItem('mp3_data')) || [
            {title: "Sample Stream", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"}
        ];
        let currentIdx = -1;

        const save = () => localStorage.setItem('mp3_data', JSON.stringify(tracks));
        const fmt = (s) => isNaN(s) ? "0:00" : Math.floor(s/60) + ":" + Math.floor(s%60).toString().padStart(2, '0');

        function render() {
            list.innerHTML = tracks.map((t, i) => `
                <div class="track ${currentIdx === i ? 'active' : ''}" onclick="playTrack(${i})">
                    <span>${t.title.substring(0, 30)}</span>
                    <button onclick="del(${i}); event.stopPropagation()"><i class="fas fa-times"></i></button>
                </div>`).join('');
            save();
        }

        function playTrack(i) {
            currentIdx = i;
            audio.src = tracks[i].url;
            audio.play();
            playIcon.className = "fas fa-pause";
            render();
        }

        function togglePlay() {
            if (!audio.src && tracks.length) return playTrack(0);
            audio.paused ? (audio.play(), playIcon.className="fas fa-pause") : (audio.pause(), playIcon.className="fas fa-play");
        }

        function addTrack() {
            const url = document.getElementById('url');
            if (!url.value) return;
            tracks.unshift({title: url.value.split('/').pop(), url: url.value});
            url.value = '';
            render();
        }

        async function loadFromJSON() {
            try {
                const r = await fetch('https://raw.githubusercontent.com/Plutana-Workflow/Plutana-Workflow.github.io/refs/heads/main/mp3/S.json');
                const data = await r.json();
                tracks = [...data.filter(i => i.type?.includes('audio')), ...tracks];
                render();
            } catch (e) { alert('Fetch failed'); }
        }

        const del = (i) => { tracks.splice(i, 1); render(); };
        const changeVol = (v) => audio.volume = Math.min(1, Math.max(0, audio.volume + v));

        audio.ontimeupdate = () => {
            pInner.style.width = (audio.currentTime / audio.duration * 100) + "%";
            document.getElementById('cur').innerText = fmt(audio.currentTime);
            document.getElementById('dur').innerText = fmt(audio.duration);
        };

        document.getElementById('p-bar').onclick = (e) => {
            audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration;
        };

        render();
    </script>
</body>
</html>
