<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PlutoShows Setup</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; background: #1a1a1a; color: #00ff00; }
        .drag-btn {
            display: inline-block;
            padding: 20px 40px;
            background: #333;
            color: #00ff00;
            text-decoration: none;
            border: 2px solid #00ff00;
            border-radius: 10px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.25rem;
            cursor: move;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            transition: 0.3s;
        }
        .drag-btn:hover { background: #00ff00; color: #000; }
        span { color: #888; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>PlutoShows Installer</h2>
    <p>Drag the button below to your <b>Bookmarks Bar</b></p>
    
    <!-- This is the link that bypasses the security block -->
    <a class="drag-btn" href="chrome://restart">PlutoShows</a>

    <span>(Once dragged, clicking it will act like typing the command manually)</span>
</body>
</html>
