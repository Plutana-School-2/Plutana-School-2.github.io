<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SoundCloud Proxy</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #111; color: white;}
        .container { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 12px; background: #222; }
        h1 { color: #ff5500; margin-bottom: 30px; }
        .btn { 
            background: #ff5500; color: white; border: none; padding: 15px 30px; 
            border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold;
            text-decoration: none; display: inline-block; transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #ff7733; }
        p { color: #888; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SoundCloud Proxy</h1>
        <!-- This opens the /stream route defined in index.js -->
        <a href="/stream" target="_blank" class="btn">Open Proxied SoundCloud</a>
        <p>The site will load via your local server (localhost:3000/stream)</p>
    </div>
</body>
</html>
