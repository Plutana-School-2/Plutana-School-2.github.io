<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: monospace; background: #000; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .player { width: 100%; max-width: 450px; border: 1px solid #333; padding: 15px; background: #0a0a0a; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 5px; border: 1px solid #333; text-align: center; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .tab.active { background: #fff; color: #000; }
        input, button { background: #000; color: #fff; border: 1px solid #333; padding: 10px; font-family: monospace; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .track-list { max-height: 250px; overflow-y: auto; border: 1px solid #1a1a1a; }
        .track { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #1a1a1a; cursor: pointer; font-size: 0.85rem; }
        .track.playing { border-left: 3px solid #fff; background: #111; }
        .progress-bar { width: 100%; height: 4px; background: #222; margin: 10px 0; cursor: pointer; }
        .progress { height: 100%; background: #fff; width: 0%; transition: width 0.1s; }
        .time { display: flex; justify-content: space-between; font-size: 0.7rem; opacity: 0.4; margin-top: 5px; }
        audio { display: none; }
    </style>
</head>
<body>
    <div class="player">
        <div class="tabs">
            <div class="tab" id="t-online" onclick="setTab('online')">Online</div>
            <div class="tab active" id="t-local" onclick="setTab('local')">Local</div>
        </div>
        <div class="progress-bar" id="p-bar"><div class="progress" id="p-inner"></div></div>
        <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="controls">
            <button onclick="toggle()"><i class="fas fa-play" id="p-icon"></i></button>
            <button onclick="vol(-0.1)"><i class="fas fa-volume-down"></i></button>
            <button onclick="vol(0.1)"><i class="fas fa-volume-up"></i></button>
        </div>
        <div class="track-list" id="list"></div>
        <div id="local-tools" style="display:flex; margin-top:10px; gap:5px;">
            <input type="text" id="url" placeholder="Direct MP3 Link" style="flex:1">
            <button onclick="add()">ADD</button>
        </div>
        <audio id="audio"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio'), pInner = document.getElementById('p-inner'), pIcon = document.getElementById('p-icon'), list = document.getElementById('list'), urlInput = document.getElementById('url'), localTools = document.getElementById('local-tools');
        let local = JSON.parse(localStorage.getItem('mp3_loc')) || [], online = JSON.parse(localStorage.getItem('mp3_on_cache')) || [], tab = 'local', playing = '';

        const fmt = (s) => isNaN(s) ? "0:00" : Math.floor(s/60) + ":" + Math.floor(s%60).toString().padStart(2, '0');
        
        fetch('https://raw.githubusercontent.com/Plutana-School-2/Plutana-School-2.github.io/refs/heads/main/mp3/S.json')
            .then(res => res.json())
            .then(data => {
                online = data.filter(i => i.type?.includes('audio'));
                localStorage.setItem('mp3_on_cache', JSON.stringify(online));
                if (tab === 'online') render();
            }).catch(e => console.log('Offline'));

        function setTab(t) {
            tab = t;
            document.getElementById('t-online').classList.toggle('active', t === 'online');
            document.getElementById('t-local').classList.toggle('active', t === 'local');
            localTools.style.display = t === 'local' ? 'flex' : 'none';
            render();
        }

        function render() {
            const tracks = tab === 'online' ? online : local;
            list.innerHTML = tracks.map((t, i) => `
                <div class="track ${playing === t.url ? 'playing' : ''}" onclick="play('${t.url}')">
                    <span>${t.title.slice(0, 30)}</span>
                    ${tab === 'local' ? `<button onclick="del(${i});event.stopPropagation()" style="border:none;background:none;color:#fff;cursor:pointer"><i class="fas fa-times"></i></button>` : ''}
                </div>`).join('');
        }

        function play(src) {
            if (playing !== src) { audio.src = src; playing = src; }
            audio.play(); pIcon.className = "fas fa-pause";
            render();
        }

        function toggle() {
            if (!audio.src) return;
            audio.paused ? (audio.play(), pIcon.className="fas fa-pause") : (audio.pause(), pIcon.className="fas fa-play");
        }

        function add() {
            if (!urlInput.value) return;
            local.unshift({title: urlInput.value.split('/').pop(), url: urlInput.value});
            urlInput.value = ''; localStorage.setItem('mp3_loc', JSON.stringify(local)); render();
        }

        const del = (i) => { local.splice(i, 1); localStorage.setItem('mp3_loc', JSON.stringify(local)); render(); };
        const vol = (v) => audio.volume = Math.min(1, Math.max(0, audio.volume + v));

        audio.ontimeupdate = () => {
            pInner.style.width = (audio.currentTime / audio.duration * 100) + "%";
            document.getElementById('cur').innerText = fmt(audio.currentTime);
            document.getElementById('dur').innerText = fmt(audio.duration);
        };

        document.getElementById('p-bar').onclick = (e) => audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration;
        
        render();
    </script>
</body>
</html>
