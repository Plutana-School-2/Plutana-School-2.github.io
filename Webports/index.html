<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlutoPorts</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            background-image: url('https://raw.githubusercontent.com/Plutana-School-2/Plutana-School-2.github.io/refs/heads/main/Webports/icons/_108277239_gettyimages-681946576.jpg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: rgba(0, 0, 0, 0.4);
        }

        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 15px;
        }

        #game-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.07);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .game-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.3);
        }

        .game-item img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        #fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="sidebar">
            <h2>PlutoPorts</h2>
            <div id="game-list">
            </div>
        </div>

        <div class="player-container">
            <div class="controls">
                <button id="fullscreen-btn">Fullscreen</button>
            </div>
            <div id="player-placeholder" class="empty-state">
                <h1>Sup</h1>
                <p>Select a game</p>
            </div>
            <iframe id="game-frame" src="" style="display: none;" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const gameFrame = document.getElementById('game-frame');
        const placeholder = document.getElementById('player-placeholder');
        const listContainer = document.getElementById('game-list');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        fullscreenBtn.onclick = () => {
            if (gameFrame.requestFullscreen) {
                gameFrame.requestFullscreen();
            } else if (gameFrame.webkitRequestFullscreen) {
                gameFrame.webkitRequestFullscreen();
            } else if (gameFrame.msRequestFullscreen) {
                gameFrame.msRequestFullscreen();
            }
        };

        async function init() {
            try {
                const response = await fetch('Cg.json');
                const games = await response.json();

                games.forEach(game => {
                    const item = document.createElement('div');
                    item.className = 'game-item';
                    item.innerHTML = `
                        <img src="${game.icon}" alt="${game.name}">
                        <span>${game.name}</span>
                    `;
                    
                    item.onclick = () => {
                        gameFrame.src = ""; 
                        
                        placeholder.style.display = 'none';
                        gameFrame.style.display = 'block';
                        fullscreenBtn.style.display = 'block';
                        
                        setTimeout(() => {
                            gameFrame.src = game.link;
                        }, 10);
                    };
                    listContainer.appendChild(item);
                });
            } catch (err) {
                listContainer.innerHTML = '<p>Error loading Cg.json</p>';
            }
        }

        init();
    </script>
</body>
</html>
