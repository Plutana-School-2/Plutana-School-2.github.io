<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlutoPorts</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            background-image: url('https://raw.githubusercontent.com/Plutana-School-2/Plutana-School-2.github.io/refs/heads/main/Webports/icons/_108277239_gettyimages-681946576.jpg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: rgba(0, 0, 0, 0.4);
        }

        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 15px;
        }

        #game-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.07);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .game-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.3);
        }

        .game-item img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
        }

        /* THE TOP TOP RIGHT BUTTON */
        #fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100000; /* Ensure it's above everything */
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* Only show when game is loaded */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        #fullscreen-btn:hover {
            transform: scale(1.1);
            background: #ff6b81;
        }

        /* Ensure button shows in browser fullscreen mode */
        #player-area:fullscreen #fullscreen-btn {
            display: block;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="sidebar">
            <h2>PlutoPorts</h2>
            <div id="game-list">
            </div>
        </div>

        <div class="player-container" id="player-area">
            <!-- Button is inside the container that goes fullscreen -->
            <button id="fullscreen-btn">GO FULLSCREEN</button>

            <div id="player-placeholder" class="empty-state">
                <h1>Sup</h1>
                <p>Select a game</p>
            </div>
            <iframe id="game-frame" src="" style="display: none;" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const gameFrame = document.getElementById('game-frame');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');
        const listContainer = document.getElementById('game-list');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                playerArea.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        };

        // Update button text based on state
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = 'EXIT FULLSCREEN';
                fullscreenBtn.style.background = '#2f3542'; // Darker when in fullscreen
            } else {
                fullscreenBtn.textContent = 'GO FULLSCREEN';
                fullscreenBtn.style.background = '#ff4757';
            }
        });

        async function init() {
            try {
                const response = await fetch('Cg.json');
                const games = await response.json();

                games.forEach(game => {
                    const item = document.createElement('div');
                    item.className = 'game-item';
                    item.innerHTML = `
                        <img src="${game.icon}" alt="${game.name}">
                        <span>${game.name}</span>
                    `;
                    
                    item.onclick = () => {
                        // UNLOAD: Clear current source immediately
                        gameFrame.src = ""; 
                        
                        placeholder.style.display = 'none';
                        gameFrame.style.display = 'block';
                        fullscreenBtn.style.display = 'block';
                        
                        // LOAD: Set new source after a tiny buffer
                        setTimeout(() => {
                            gameFrame.src = game.link;
                        }, 50);
                    };
                    listContainer.appendChild(item);
                });
            } catch (err) {
                listContainer.innerHTML = '<p style="padding:20px; color:red;">Error loading Cg.json - make sure the file exists!</p>';
            }
        }

        init();
    </script>
</body>
</html>
