<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlutoPorts</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #111 url('https://raw.githubusercontent.com/Plutana-School-2/Plutana-School-2.github.io/main/Webports/icons/_108277239_gettyimages-681946576.jpg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: rgba(0, 0, 0, 0.3);
        }

        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.85);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 15px;
        }

        #game-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(8px);
            border-color: rgba(255,255,255,0.4);
        }

        .game-item img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: transparent;
        }

        /* UPDATED BUTTON STYLE: Transparent, White Outline, White Text */
        #fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100000;
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #player-area:fullscreen #fullscreen-btn {
            display: block;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 50px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="sidebar">
            <h2>PlutoPorts</h2>
            <div id="game-list">
            </div>
        </div>

        <div class="player-container" id="player-area">
            <button id="fullscreen-btn">Go Fullscreen</button>

            <div id="player-placeholder" class="empty-state">
                <h1 style="font-size: 3rem; margin-bottom: 10px;">Sup</h1>
                <p style="opacity: 0.8;">Select a game to start playing</p>
            </div>
            <iframe id="game-frame" src="" style="display: none;" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const gameFrame = document.getElementById('game-frame');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');
        const listContainer = document.getElementById('game-list');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                playerArea.requestFullscreen().catch(err => {
                    console.error(err);
                });
            } else {
                document.exitFullscreen();
            }
        };

        // Update button text while staying transparent
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = 'Exit Fullscreen';
            } else {
                fullscreenBtn.textContent = 'Go Fullscreen';
            }
        });

        async function init() {
            try {
                const response = await fetch('Cg.json');
                const games = await response.json();

                games.forEach(game => {
                    const item = document.createElement('div');
                    item.className = 'game-item';
                    item.innerHTML = `
                        <img src="${game.icon}" alt="${game.name}">
                        <span>${game.name}</span>
                    `;
                    
                    item.onclick = () => {
                        // UNLOAD previous source
                        gameFrame.src = ""; 
                        
                        placeholder.style.display = 'none';
                        gameFrame.style.display = 'block';
                        fullscreenBtn.style.display = 'block';
                        
                        // LOAD new source
                        setTimeout(() => {
                            gameFrame.src = game.link;
                        }, 100);
                    };
                    listContainer.appendChild(item);
                });
            } catch (err) {
                listContainer.innerHTML = '<p style="color: white; text-align: center;">Unable to load Cg.json</p>';
            }
        }

        init();
    </script>
</body>
</html>
